name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test
    # Pinned: jetli/trunk-action fails on the Ubuntu 26 ubuntu-latest image (EXDEV on install).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxdo-dev libatk1.0-dev libglib2.0-dev protobuf-compiler

      - name: Build WASM UI
        run: cd ui && trunk build --release

      - name: Format check
        run: cargo fmt --check --all

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Docs
        # The app's binary and the lib crate are both named flighthook, so the
        # app is documented on its own to keep their doc pages apart.
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --exclude flighthook-app --no-deps --document-private-items --locked
          cargo doc -p flighthook-app --no-deps --document-private-items --locked

      - name: Run tests
        run: cargo test --workspace --locked
