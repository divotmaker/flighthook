[package]
name = "flighthook"
version = "0.2.2"
edition = "2024"
rust-version = "1.94"
description = "flighthook event bus types and schemas"
license = "MIT OR Apache-2.0"
keywords = ["golf", "launch-monitor"]
categories = ["data-structures"]
repository = "https://github.com/divotmaker/flighthook"

[features]
clap = ["dep:clap"]

[dependencies]
# `mock`: the mock launch monitor's settings (`MockConfig`), with the
# driver settings contract (`DriverConfig`); adds no dependencies.
flightrelay = { version = "0.6.0", features = ["mock"] }
# The FlightScope driver's settings (`ironsight::config::Config`, the
# `config` feature: no device stack, so the WASM UI builds it too).
ironsight = { version = "0.8.0", default-features = false, features = ["config"] }
# The R10 driver's settings (`tenover::config::Config`, the `config`
# feature: no BLE stack, so the WASM UI builds it too).
tenover = { version = "0.6.0", default-features = false, features = ["config"] }
# The Square Golf driver's settings (`allsquare::config::Config`, the
# `config` feature: no BLE stack, so the WASM UI builds it too).
allsquare = { version = "0.5.0", default-features = false, features = ["config"] }
# The ExPutt driver's settings (`threeputt::config::Config`, the `config`
# feature: no network code, so the WASM UI builds it too).
threeputt = { version = "0.2.0", default-features = false, features = ["config"] }
# The Trackball driver's settings (`thumbswing::Settings`, the `config`
# feature: no device stack, so the WASM UI builds it too).
thumbswing = { version = "0.0.3", default-features = false, features = ["config"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"], optional = true }
